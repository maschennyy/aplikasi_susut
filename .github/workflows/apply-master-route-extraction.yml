name: Apply master route extraction

on:
  push:
    branches:
      - refactor-remove-legacy-master-routes
    paths:
      - ".github/workflows/apply-master-route-extraction.yml"
      - "scripts/cleanup_master_routes.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-master-route-extraction.yml"
      - "scripts/cleanup_master_routes.py"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-remove-legacy-master-routes
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r backend/requirements.txt
      - run: python scripts/cleanup_master_routes.py
      - run: python -m unittest discover -s backend/tests -t . -v

      - name: Save refactor result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app.py backend/entrypoint.py
          git commit -m "refactor: extract master routes from app"
          git push origin HEAD:refactor-remove-legacy-master-routes
