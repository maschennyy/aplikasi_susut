name: Apply meter data refactor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readings-meter-data-blueprint
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python scripts/refactor_meter_data.py
      - run: python -m unittest discover -s backend/tests -t . -v
      - name: Save tested app refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app.py
          git commit -m "refactor: move meter data to readings blueprint"
          git push origin HEAD:readings-meter-data-blueprint
