name: Generate migration baseline v2

on:
  push:
    branches:
      - fix/database-migrations
    paths:
      - ".github/workflows/generate-migrations-v2.yml"
      - "scripts/prepare_migration_integration.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/generate-migrations-v2.yml"
      - "scripts/prepare_migration_integration.py"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: fix/database-migrations
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare migration integration
        run: python scripts/prepare_migration_integration.py

      - name: Install backend dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r backend/requirements.txt

      - name: Generate baseline and validate fresh database
        shell: bash
        run: |
          rm -rf backend/migrations /tmp/alembic-autogen.db /tmp/alembic-upgrade.db
          APP_ENV=test TEST_DATABASE_URL=sqlite:////tmp/alembic-autogen.db \
            python -m flask --app backend.entrypoint db init >/tmp/db-init.log 2>&1
          APP_ENV=test TEST_DATABASE_URL=sqlite:////tmp/alembic-autogen.db \
            python -m flask --app backend.entrypoint db migrate -m "baseline schema" >/tmp/db-migrate.log 2>&1
          test -n "$(find backend/migrations/versions -name '*.py' -print -quit)"
          APP_ENV=test TEST_DATABASE_URL=sqlite:////tmp/alembic-upgrade.db \
            python -m flask --app backend.entrypoint db upgrade >/tmp/db-upgrade.log 2>&1
          APP_ENV=test TEST_DATABASE_URL=sqlite:////tmp/alembic-upgrade.db \
            python -m flask --app backend.entrypoint schema-check >/tmp/schema-check.log 2>&1

      - name: Run tests and capture output
        shell: bash
        run: |
          set +e
          python -m unittest discover -s backend/tests -t . -v >backend/test-output.log 2>&1
          echo $? > backend/test-exit-code.txt
          set -e
          cat backend/test-output.log

      - name: Commit generated files and diagnostics
        shell: bash
        run: |
          rm -f .github/workflows/generate-migrations.yml
          rm -f .github/workflows/generate-migrations-v2.yml
          rm -f scripts/prepare_migration_integration.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: manage database schema with Alembic"
          git push origin HEAD:fix/database-migrations
