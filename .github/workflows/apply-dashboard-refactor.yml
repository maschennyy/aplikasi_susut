name: Apply dashboard data refactor

on:
  push:
    branches:
      - dashboard-data-refactor
    paths:
      - ".github/workflows/apply-dashboard-refactor.yml"
      - "scripts/refactor_dashboard_data.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-dashboard-refactor.yml"
      - "scripts/refactor_dashboard_data.py"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dashboard-data-refactor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python scripts/refactor_dashboard_data.py
      - run: python -m unittest discover -s backend/tests -t . -v
      - name: Save app refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app.py
          git commit -m "refactor: move dashboard data to blueprint"
          git push origin HEAD:dashboard-data-refactor
