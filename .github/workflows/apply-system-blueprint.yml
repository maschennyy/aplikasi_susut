name: Apply system blueprint refactor

on:
  push:
    branches:
      - refactor/system-blueprint
    paths:
      - ".github/workflows/apply-system-blueprint.yml"
      - "scripts/apply_system_blueprint_refactor.py"

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/system-blueprint
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Apply targeted app refactor
        run: python scripts/apply_system_blueprint_refactor.py

      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -t . -v

      - name: Commit refactor result
        shell: bash
        run: |
          rm .github/workflows/apply-system-blueprint.yml
          rm scripts/apply_system_blueprint_refactor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: move sidebar stats to system blueprint"
          git push origin HEAD:refactor/system-blueprint
